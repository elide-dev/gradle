name: "Release"

"on":
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Setup: Java 17"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: "Setup: Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: "Check: Tag matches version"
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::gradle.properties has version $version, tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: "Build: Plugin and catalog"
        run: ./gradlew --no-daemon :elide-gradle-plugin:jar :elide-gradle-plugin:sourcesJar :elide-gradle-plugin:javadocJar :elide-gradle-catalog:generateCatalogAsToml
      - name: "Release: GitHub"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            elide-gradle-plugin/build/libs/*.jar \
            elide-gradle-catalog/build/version-catalog/libs.versions.toml

  maven-central:
    name: "Maven Central"
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Check: Publishing secrets"
        env:
          CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          missing=""
          [ -n "$CENTRAL_USER" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$CENTRAL_TOKEN" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$GPG_KEY" ] || missing="$missing GPG_SIGNING_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Setup: Java 17"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: "Setup: Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: "Publish: Maven Central"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          # base64 of the key, as in elide-dev/runtime; the signer wants it ASCII-armored
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --quiet --import
          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --pinentry-mode loopback \
            --passphrase "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" --armor --export-secret-keys)"
          # Actions masks the base64 secret, not the armored lines.
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          export ORG_GRADLE_PROJECT_signingInMemoryKey
          ./gradlew --no-daemon :elide-gradle-plugin:publishToMavenCentral :elide-gradle-catalog:publishToMavenCentral
