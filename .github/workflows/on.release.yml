name: "Release"

"on":
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Setup: Java 17"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: "Setup: Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: "Check: Tag matches version"
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::gradle.properties has version $version, tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: "Build: Plugin and catalog"
        run: ./gradlew --no-daemon :elide-gradle-plugin:jar :elide-gradle-plugin:sourcesJar :elide-gradle-plugin:javadocJar :elide-gradle-catalog:generateCatalogAsToml
      - name: "Release: GitHub"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            elide-gradle-plugin/build/libs/*.jar \
            elide-gradle-catalog/build/version-catalog/libs.versions.toml

  plugin-portal:
    name: "Gradle Plugin Portal"
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Check: Publishing secrets"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          missing=""
          [ -n "$GRADLE_PUBLISH_KEY" ] || missing="$missing GRADLE_PUBLISH_KEY"
          [ -n "$GRADLE_PUBLISH_SECRET" ] || missing="$missing GRADLE_PUBLISH_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Setup: Java 17"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: "Setup: Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: "Publish: Plugin Portal"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew --no-daemon :elide-gradle-plugin:publishPlugins
